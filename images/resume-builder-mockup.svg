<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="resumeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad2)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="180" cy="160" r="140" fill="#3b82f6" opacity="0.1" filter="blur(50px)"/>
  <circle cx="650" cy="380" r="130" fill="#60a5fa" opacity="0.08" filter="blur(40px)"/>

  <!-- Main Container -->
  <rect x="40" y="35" width="720" height="430" rx="20" fill="rgba(18, 18, 22, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#cardShadow2)"/>

  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="48" rx="20" fill="rgba(255, 255, 255, 0.02)"/>
  <circle cx="70" cy="59" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="88" cy="59" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="106" cy="59" r="5" fill="#10b981" opacity="0.8"/>
  
  <rect x="300" y="47" width="200" height="24" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="400" y="63" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">resume-builder.app</text>

  <!-- Left: Editor Form Controls -->
  <rect x="65" y="105" width="310" height="335" rx="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="85" y="135" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600">Resume Customizer</text>
  <text x="85" y="152" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Real-time LaTeX-grade rendering</text>

  <!-- Input Field 1 -->
  <text x="85" y="185" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Full Name</text>
  <rect x="85" y="195" width="270" height="34" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="97" y="217" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="12">Pavan Ramesh Malthi</text>

  <!-- Input Field 2 -->
  <text x="85" y="250" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Professional Title</text>
  <rect x="85" y="260" width="270" height="34" rx="8" fill="rgba(0,0,0,0.3)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="97" y="282" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="12">Full Stack Developer</text>

  <!-- Section Toggles -->
  <text x="85" y="315" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Active Sections</text>
  <g transform="translate(85, 328)">
    <rect x="0" y="0" width="80" height="24" rx="12" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
    <text x="40" y="16" fill="#60a5fa" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">✓ Skills</text>

    <rect x="90" y="0" width="80" height="24" rx="12" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
    <text x="130" y="16" fill="#60a5fa" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">✓ Projects</text>

    <rect x="180" y="0" width="80" height="24" rx="12" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
    <text x="220" y="16" fill="#60a5fa" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">✓ History</text>
  </g>

  <!-- Action Button -->
  <rect x="85" y="380" width="270" height="38" rx="10" fill="url(#resumeAccent)"/>
  <text x="220" y="404" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⬇ Export Document</text>

  <!-- Right: Live Minimal Resume Paper Preview -->
  <rect x="400" y="105" width="335" height="335" rx="14" fill="#ffffff" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
  
  <!-- Resume Header on Paper -->
  <text x="425" y="140" fill="#0f172a" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700">Pavan Ramesh Malthi</text>
  <text x="425" y="156" fill="#3b82f6" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600">FULL STACK DEVELOPER · AI ENTHUSIAST</text>
  <text x="425" y="170" fill="#64748b" font-family="'Inter', -apple-system, sans-serif" font-size="9">github.com/PavanRameshMalthi · linkedin.com/in/pavan-ramesh-malthi</text>
  
  <line x1="425" y1="180" x2="710" y2="180" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Resume Section: Technical Skills -->
  <text x="425" y="198" fill="#0f172a" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700">TECHNICAL SKILLS</text>
  <text x="425" y="213" fill="#334155" font-family="'Inter', -apple-system, sans-serif" font-size="8.5"><tspan font-weight="600">Frontend:</tspan> React.js, JavaScript, Next.js, HTML5, CSS3, Tailwind CSS</text>
  <text x="425" y="226" fill="#334155" font-family="'Inter', -apple-system, sans-serif" font-size="8.5"><tspan font-weight="600">Backend &amp; DB:</tspan> Node.js, Express.js, MongoDB, PostgreSQL, REST APIs</text>
  
  <line x1="425" y1="236" x2="710" y2="236" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Resume Section: Experience -->
  <text x="425" y="254" fill="#0f172a" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700">EXPERIENCE</text>
  <text x="425" y="269" fill="#0f172a" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="600">MERN Stack Development Intern — Adhoc Network Tech</text>
  <text x="425" y="280" fill="#64748b" font-family="'Inter', -apple-system, sans-serif" font-size="8">45 Days Intensive Internship · 2026</text>
  <text x="425" y="293" fill="#334155" font-family="'Inter', -apple-system, sans-serif" font-size="8.5">• Developed responsive web apps with React, Express.js &amp; MongoDB</text>
  <text x="425" y="305" fill="#334155" font-family="'Inter', -apple-system, sans-serif" font-size="8.5">• Implemented secure JWT authentication and RESTful API endpoints</text>

  <line x1="425" y1="315" x2="710" y2="315" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Resume Section: Education -->
  <text x="425" y="333" fill="#0f172a" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700">EDUCATION</text>
  <text x="425" y="348" fill="#0f172a" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="600">Bachelor of Computer Applications (BCA)</text>
  <text x="425" y="359" fill="#64748b" font-family="'Inter', -apple-system, sans-serif" font-size="8">Aditya Degree College (2024–2027)</text>

  <line x1="425" y1="370" x2="710" y2="370" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Live Badge on Paper -->
  <rect x="625" y="395" width="85" height="22" rx="6" fill="#f1f5f9"/>
  <text x="667" y="410" fill="#475569" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">ATS Optimized</text>
</svg>
