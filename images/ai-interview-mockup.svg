<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="680" cy="120" r="140" fill="#3b82f6" opacity="0.12" filter="blur(50px)"/>
  <circle cx="150" cy="400" r="120" fill="#60a5fa" opacity="0.08" filter="blur(40px)"/>

  <!-- Main Container / Window -->
  <rect x="40" y="35" width="720" height="430" rx="20" fill="rgba(18, 18, 22, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="48" rx="20" fill="rgba(255, 255, 255, 0.02)"/>
  <circle cx="70" cy="59" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="88" cy="59" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="106" cy="59" r="5" fill="#10b981" opacity="0.8"/>
  
  <rect x="300" y="47" width="200" height="24" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="400" y="63" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">ai-mock-interview.app</text>

  <!-- Left Panel: Interview Progress & Metrics -->
  <rect x="65" y="105" width="210" height="335" rx="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  
  <text x="85" y="135" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600">Session Evaluation</text>
  <rect x="85" y="150" width="76" height="20" rx="10" fill="rgba(59, 130, 246, 0.15)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
  <text x="123" y="164" fill="#60a5fa" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">LIVE AI COACH</text>

  <!-- Score Ring Graphic -->
  <circle cx="170" cy="240" r="46" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="8"/>
  <circle cx="170" cy="240" r="46" fill="none" stroke="url(#blueGrad)" stroke-width="8" stroke-dasharray="289" stroke-dashoffset="40" stroke-linecap="round" transform="rotate(-90 170 240)"/>
  <text x="170" y="242" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">94%</text>
  <text x="170" y="258" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="10" text-anchor="middle">Confidence Score</text>

  <!-- Metric Bars -->
  <text x="85" y="320" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Technical Depth</text>
  <rect x="85" y="328" width="170" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
  <rect x="85" y="328" width="150" height="6" rx="3" fill="#3b82f6"/>

  <text x="85" y="360" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Communication</text>
  <rect x="85" y="368" width="170" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
  <rect x="85" y="368" width="160" height="6" rx="3" fill="#60a5fa"/>

  <text x="85" y="400" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Problem Solving</text>
  <rect x="85" y="408" width="170" height="6" rx="3" fill="rgba(255, 255, 255, 0.08)"/>
  <rect x="85" y="408" width="140" height="6" rx="3" fill="#3b82f6"/>

  <!-- Right Stage: AI Prompt & Realtime Audio Waveform -->
  <rect x="295" y="105" width="440" height="205" rx="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  
  <rect x="315" y="125" width="30" height="30" rx="8" fill="url(#blueGrad)"/>
  <path d="M325 140 L335 135 L335 145 Z" fill="#ffffff"/>
  
  <text x="355" y="138" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600">Question 04 of 08 · Technical Deep Dive</text>
  <text x="355" y="152" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Full Stack Architecture &amp; State Management</text>

  <!-- Question Box -->
  <rect x="315" y="170" width="400" height="60" rx="10" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
  <text x="330" y="195" fill="#f4f4f5" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400">&quot;Explain how you would design an asynchronous job processing system</text>
  <text x="330" y="213" fill="#f4f4f5" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="400">using Node.js, Express, and Redis message queues.&quot;</text>

  <!-- Waveform Indicator -->
  <g transform="translate(315, 250)">
    <rect x="0" y="12" width="4" height="12" rx="2" fill="#3b82f6"/>
    <rect x="10" y="8" width="4" height="20" rx="2" fill="#60a5fa"/>
    <rect x="20" y="4" width="4" height="28" rx="2" fill="#3b82f6"/>
    <rect x="30" y="14" width="4" height="8" rx="2" fill="#60a5fa"/>
    <rect x="40" y="6" width="4" height="24" rx="2" fill="#3b82f6"/>
    <rect x="50" y="2" width="4" height="32" rx="2" fill="#60a5fa"/>
    <rect x="60" y="10" width="4" height="16" rx="2" fill="#3b82f6"/>
    <rect x="70" y="5" width="4" height="26" rx="2" fill="#60a5fa"/>
    <rect x="80" y="14" width="4" height="8" rx="2" fill="#3b82f6"/>
    <text x="100" y="22" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Voice input capturing &amp; analyzing in real-time...</text>
  </g>

  <!-- AI Feedback Snippet Box -->
  <rect x="295" y="325" width="440" height="115" rx="14" fill="rgba(59, 130, 246, 0.06)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1"/>
  <text x="315" y="352" fill="#60a5fa" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600">✨ Gemini AI Feedback &amp; Suggestions</text>
  <text x="315" y="375" fill="#d4d4d8" font-family="'Inter', -apple-system, sans-serif" font-size="11">Strong explanation on horizontal scaling and decoupling. Consider mentioning</text>
  <text x="315" y="393" fill="#d4d4d8" font-family="'Inter', -apple-system, sans-serif" font-size="11">dead-letter queues (DLQ) and exponential backoff retry policies for resilience.</text>
  <text x="315" y="420" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="10">Evaluation generated in 142ms · Gemini 1.5 Pro</text>
</svg>
