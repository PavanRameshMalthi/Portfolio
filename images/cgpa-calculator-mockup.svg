<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="cardShadow4" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad4)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="250" cy="200" r="140" fill="#f59e0b" opacity="0.08" filter="blur(50px)"/>
  <circle cx="600" cy="350" r="130" fill="#3b82f6" opacity="0.08" filter="blur(40px)"/>

  <!-- Main Container -->
  <rect x="40" y="35" width="720" height="430" rx="20" fill="rgba(18, 18, 22, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#cardShadow4)"/>

  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="48" rx="20" fill="rgba(255, 255, 255, 0.02)"/>
  <circle cx="70" cy="59" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="88" cy="59" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="106" cy="59" r="5" fill="#10b981" opacity="0.8"/>
  
  <rect x="300" y="47" width="200" height="24" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="400" y="63" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">cgpa-calculator.app</text>

  <!-- Left: Semester Grade Cards Matrix -->
  <rect x="65" y="105" width="370" height="335" rx="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="85" y="135" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600">Semester SGPA Entry Matrix</text>
  <text x="85" y="152" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Weighted university credit point conversion</text>

  <!-- Semester Cards Grid 2x2 -->
  <!-- Sem 1 -->
  <g transform="translate(85, 175)">
    <rect x="0" y="0" width="155" height="64" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="14" y="24" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="10">SEMESTER 1</text>
    <text x="14" y="48" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700">8.85 <tspan fill="#a1a1aa" font-size="11" font-weight="400">SGPA</tspan></text>
  </g>

  <!-- Sem 2 -->
  <g transform="translate(255, 175)">
    <rect x="0" y="0" width="160" height="64" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="14" y="24" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="10">SEMESTER 2</text>
    <text x="14" y="48" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700">9.10 <tspan fill="#a1a1aa" font-size="11" font-weight="400">SGPA</tspan></text>
  </g>

  <!-- Sem 3 -->
  <g transform="translate(85, 250)">
    <rect x="0" y="0" width="155" height="64" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="14" y="24" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="10">SEMESTER 3</text>
    <text x="14" y="48" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700">8.95 <tspan fill="#a1a1aa" font-size="11" font-weight="400">SGPA</tspan></text>
  </g>

  <!-- Sem 4 -->
  <g transform="translate(255, 250)">
    <rect x="0" y="0" width="160" height="64" rx="10" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="14" y="24" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="10">SEMESTER 4</text>
    <text x="14" y="48" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700">9.25 <tspan fill="#a1a1aa" font-size="11" font-weight="400">SGPA</tspan></text>
  </g>

  <!-- Quick Action Button -->
  <rect x="85" y="380" width="330" height="38" rx="10" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
  <text x="250" y="404" fill="#fbbf24" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">+ Add Additional Semester</text>

  <!-- Right: Real-time Cumulative CGPA Showcase -->
  <rect x="455" y="105" width="280" height="335" rx="14" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  
  <rect x="475" y="125" width="240" height="150" rx="12" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>
  <text x="595" y="155" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11" text-anchor="middle">OVERALL CUMULATIVE CGPA</text>
  <text x="595" y="215" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" text-anchor="middle">9.04</text>
  <text x="595" y="245" fill="#10b981" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">★ Outstanding (O Grade / Distinction)</text>

  <!-- Percentage Conversion -->
  <g transform="translate(475, 290)">
    <rect x="0" y="0" width="240" height="40" rx="8" fill="rgba(255, 255, 255, 0.03)"/>
    <text x="14" y="25" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Equivalent Percentage</text>
    <text x="226" y="25" fill="#f4f4f5" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="end">85.4%</text>
  </g>

  <!-- Total Credits -->
  <g transform="translate(475, 340)">
    <rect x="0" y="0" width="240" height="40" rx="8" fill="rgba(255, 255, 255, 0.03)"/>
    <text x="14" y="25" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Total Credits Earned</text>
    <text x="226" y="25" fill="#f4f4f5" font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="end">88 Credits</text>
  </g>

  <text x="595" y="415" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="10" text-anchor="middle">Instant calculations with zero page reloads</text>
</svg>
