<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="cardShadow3" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="500" cy="180" r="150" fill="#0284c7" opacity="0.12" filter="blur(50px)"/>

  <!-- Main Container -->
  <rect x="40" y="35" width="720" height="430" rx="20" fill="rgba(18, 18, 22, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" filter="url(#cardShadow3)"/>

  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="48" rx="20" fill="rgba(255, 255, 255, 0.02)"/>
  <circle cx="70" cy="59" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="88" cy="59" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="106" cy="59" r="5" fill="#10b981" opacity="0.8"/>
  
  <rect x="300" y="47" width="200" height="24" rx="12" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="400" y="63" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">weather-tracker.app</text>

  <!-- Left: Main Weather Hero Card -->
  <rect x="65" y="105" width="350" height="335" rx="16" fill="url(#skyGrad)" opacity="0.9"/>
  
  <!-- Weather & Time -->
  <text x="95" y="145" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="700">Live Weather</text>
  <text x="95" y="165" fill="#e0f2fe" font-family="'Inter', -apple-system, sans-serif" font-size="12">Thursday · Real-Time Meteorological Data</text>

  <!-- Big Temp Display -->
  <text x="95" y="245" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="800">24°</text>
  <text x="210" y="215" fill="#e0f2fe" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600">Partly Cloudy</text>
  <text x="210" y="235" fill="#bae6fd" font-family="'Inter', -apple-system, sans-serif" font-size="12">High: 28° · Low: 19°</text>

  <!-- Mini Atmosphere Grid on hero card -->
  <g transform="translate(95, 290)">
    <rect x="0" y="0" width="85" height="60" rx="10" fill="rgba(255, 255, 255, 0.15)"/>
    <text x="42" y="25" fill="#e0f2fe" font-family="'Inter', -apple-system, sans-serif" font-size="10" text-anchor="middle">HUMIDITY</text>
    <text x="42" y="47" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">62%</text>

    <rect x="100" y="0" width="85" height="60" rx="10" fill="rgba(255, 255, 255, 0.15)"/>
    <text x="142" y="25" fill="#e0f2fe" font-family="'Inter', -apple-system, sans-serif" font-size="10" text-anchor="middle">WIND SPEED</text>
    <text x="142" y="47" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">12 km/h</text>

    <rect x="200" y="0" width="85" height="60" rx="10" fill="rgba(255, 255, 255, 0.15)"/>
    <text x="242" y="25" fill="#e0f2fe" font-family="'Inter', -apple-system, sans-serif" font-size="10" text-anchor="middle">UV INDEX</text>
    <text x="242" y="47" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Moderate</text>
  </g>

  <!-- Right: 5-Day Forecast & Dynamic Curve -->
  <rect x="435" y="105" width="300" height="335" rx="16" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="455" y="135" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600">Hourly &amp; Weekly Forecast</text>
  
  <!-- Mini Temperature Polyline Chart -->
  <g transform="translate(455, 155)">
    <polyline points="0,50 50,30 100,20 150,35 200,15 250,25" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="0" cy="50" r="3.5" fill="#38bdf8"/>
    <circle cx="50" cy="30" r="3.5" fill="#38bdf8"/>
    <circle cx="100" cy="20" r="3.5" fill="#38bdf8"/>
    <circle cx="150" cy="35" r="3.5" fill="#38bdf8"/>
    <circle cx="200" cy="15" r="3.5" fill="#38bdf8"/>
    <circle cx="250" cy="25" r="3.5" fill="#38bdf8"/>
  </g>

  <!-- Forecast Row 1 -->
  <g transform="translate(455, 245)">
    <rect x="0" y="0" width="260" height="36" rx="8" fill="rgba(255, 255, 255, 0.02)"/>
    <text x="15" y="22" fill="#f4f4f5" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500">Friday</text>
    <text x="130" y="22" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Sunny</text>
    <text x="240" y="22" fill="#38bdf8" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">26° / 18°</text>
  </g>

  <!-- Forecast Row 2 -->
  <g transform="translate(455, 290)">
    <rect x="0" y="0" width="260" height="36" rx="8" fill="rgba(255, 255, 255, 0.02)"/>
    <text x="15" y="22" fill="#f4f4f5" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500">Saturday</text>
    <text x="130" y="22" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Clear</text>
    <text x="240" y="22" fill="#38bdf8" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">25° / 17°</text>
  </g>

  <!-- Forecast Row 3 -->
  <g transform="translate(455, 335)">
    <rect x="0" y="0" width="260" height="36" rx="8" fill="rgba(255, 255, 255, 0.02)"/>
    <text x="15" y="22" fill="#f4f4f5" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500">Sunday</text>
    <text x="130" y="22" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="11">Clear Sky</text>
    <text x="240" y="22" fill="#38bdf8" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="end">27° / 19°</text>
  </g>

  <!-- Footer Tag -->
  <text x="455" y="415" fill="#a1a1aa" font-family="'Inter', -apple-system, sans-serif" font-size="10">Powered by OpenWeatherMap API &amp; Geolocation</text>
</svg>
